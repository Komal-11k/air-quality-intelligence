services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: air-quality-postgres
    environment:
      POSTGRES_DB: air_quality
      POSTGRES_USER: air_quality
      POSTGRES_PASSWORD: air_quality_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: air-quality-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: